name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a new push cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, like the machines these dotfiles target.
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      # Full history, so the commit-message check can walk the pushed range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install git just bats-core shellcheck jq lychee gitleaks mise navi

      # jj from the release, pinned: the runner's Homebrew tap can lag (it served
      # 0.45, and jw needs 0.46+, where each workspace is a real git worktree).
      - name: Install jj
        env:
          JJ_VERSION: 0.46.0
          JJ_SHA256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58
        run: |
          tarball="jj-v${JJ_VERSION}-aarch64-apple-darwin.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${tarball}"
          echo "${JJ_SHA256}  ${tarball}" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/jj" && tar -xzf "$tarball" -C "$RUNNER_TEMP/jj"
          jj_bin=$(find "$RUNNER_TEMP/jj" -type f -name jj | head -1)
          dirname "$jj_bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          bash --version | head -1
          for t in git just bats shellcheck jj jq lychee gitleaks mise zsh; do
            printf '%-10s %s (%s)\n' "$t" "$("$t" --version 2>&1 | head -1)" "$(command -v "$t")"
          done
          echo "::notice title=versions::$(git --version) at $(command -v git), $(jj --version)"

      # `just check` = lint + test + secrets. Separate steps so a failure names
      # its stage, and failing output becomes annotations readable without login.
      - name: just lint
        shell: bash
        run: |
          set -o pipefail
          just lint 2>&1 | tee lint.log || { tail -30 lint.log | sed 's/^/::error title=lint::/'; exit 1; }

      - name: just test
        shell: bash
        run: |
          set -o pipefail
          bats --print-output-on-failure --formatter tap tests 2>&1 | tee test.log || {
            # One annotation (GitHub keeps at most 10 per step), newlines as %0A.
            msg=$(sed -n '/^not ok/,/^ok /p' test.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=bats failures::${msg}"
            exit 1
          }

      - name: just secrets
        shell: bash
        run: |
          set -o pipefail
          just secrets 2>&1 | tee secrets.log || { tail -30 secrets.log | sed 's/^/::error title=secrets::/'; exit 1; }

      # The pull request's own commits, or the commits a push added. A new branch has no
      # "before" (all zeros), so only its tip is checked.
      - name: just commits
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          if [[ -z $BASE || $BASE =~ ^0+$ ]]; then range="$HEAD_SHA~1..$HEAD_SHA"; else range="$BASE..$HEAD_SHA"; fi
          just commits "$range" 2>&1 | tee commits.log || { sed 's/^/::error title=commit message::/' commits.log; exit 1; }

  history-secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history, not a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action scans only the
      # pushed commit range on push events and is not MIT-licensed since v2.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Every commit reachable from the checked-out ref (the merge commit on PRs).
      # Other remote branches are not scanned, so delete stale ones instead.
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts=HEAD
