name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a new push cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, like the machines these dotfiles target.
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install just bats-core shellcheck jj jq lychee gitleaks mise

      - name: Tool versions
        run: |
          bash --version | head -1
          for t in just bats shellcheck jj jq lychee gitleaks mise zsh; do
            printf '%-10s %s\n' "$t" "$("$t" --version 2>&1 | head -1)"
          done

      # `just check` = lint + test + secrets. Separate steps so a failure names
      # its stage, and failing output becomes annotations readable without login.
      - name: just lint
        shell: bash
        run: |
          set -o pipefail
          just lint 2>&1 | tee lint.log || { tail -30 lint.log | sed 's/^/::error title=lint::/'; exit 1; }

      - name: just test
        shell: bash
        run: |
          set -o pipefail
          bats --formatter tap tests 2>&1 | tee test.log || {
            grep -A12 '^not ok' test.log | head -60 | sed 's/^/::error title=bats::/'
            exit 1
          }

      - name: just secrets
        shell: bash
        run: |
          set -o pipefail
          just secrets 2>&1 | tee secrets.log || { tail -30 secrets.log | sed 's/^/::error title=secrets::/'; exit 1; }

  history-secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history, not a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action scans only the
      # pushed commit range on push events and is not MIT-licensed since v2.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Every commit reachable from the checked-out ref (the merge commit on PRs).
      # Other remote branches are not scanned, so delete stale ones instead.
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts=HEAD
