# Local dev infrastructure mirroring production (Redis, Apache Kafka) + tracing.
# Use via the `infra` shell command (zsh/infra.zsh): infra up | down | ps | logs | reset.
# Ports bind to loopback only (IPv4 + IPv6, so "localhost" works for clients that try ::1 first).
name: devinfra

services:
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0   # KRaft, single node
    ports:
      - "127.0.0.1:9092:9092"
      - "[::1]:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "127.0.0.1:8088:8080"
      - "[::1]:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka: { condition: service_healthy }

  jaeger:
    image: jaegertracing/jaeger:latest   # UI :16686, OTLP gRPC :4317, OTLP HTTP :4318
    ports:
      - "127.0.0.1:16686:16686"
      - "[::1]:16686:16686"
      - "127.0.0.1:4317:4317"
      - "[::1]:4317:4317"
      - "127.0.0.1:4318:4318"
      - "[::1]:4318:4318"

volumes:
  redis-data:
  kafka-data:
