# Global mise tools: inspection/dev tools that behave the same in every project.
# Project-specific tools that must match CI (golangci-lint, biome, typescript, buf...)
# belong in each project's mise.toml / package.json / go.mod `tool` directive instead.
# Go (/usr/local/go) and Rust (rustup) come from their official installers rather than
# mise, so each project's go.mod `toolchain` or rust-toolchain.toml picks the version.

[tools]
node = "24"
pnpm = "latest"
yq = "latest"
helm = "latest"
gcloud = "latest"
"npm:prettier" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:gotest.tools/gotestsum" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"cargo:abtop" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-insta" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-semver-checks" = "latest"
"pypi:harbor" = "latest"
